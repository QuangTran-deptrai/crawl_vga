name: Daily VGA Data Scraper

on:
  schedule:
    - cron: '40 1 * * *' # Chạy vào 01:40 UTC (8h40 sáng VN) mỗi ngày
  workflow_dispatch: # Nút nhấn chạy thủ công phòng trường hợp bạn muốn test

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cho phép GitHub Actions push code mới lên repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Lưu cache pip để các lần chạy sau cài đặt nhanh hơn

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run vga_scraper.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vga_scraper.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Chỉ add file data, bỏ qua log hoặc cache nếu có
          git add -f vga_data.xlsx
          
          # Kiểm tra xem có thay đổi mới không, nếu có thì commit và push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Crawl dữ liệu VGA mới nhất [skip ci]" && git push)
